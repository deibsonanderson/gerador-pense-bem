<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Pense Bem - Layout Ajustado</title>
  <link rel="stylesheet" href="./styles/style.css">
  <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
</head>

<body>

  <div class="console">
    <div class="top">
      <div class="display" id="display"></div>
      <div class="floppy-drive"></div>
    </div>

    <div class="question" id="question">Pressione ENTER para começar</div>

    <div class="keyboard">

      <div class="row top">
        <div class="row top-letters">
          <button class="big red">A</button>
          <button class="big yellow-big">B</button>
          <button class="big blue">C</button>
          <button class="big green">D</button>
        </div>

        <div class="row">
          <div class="row functions">
            <button class="gray">ENTER</button>
            <button class="gray">LIVRO</button>
            <button class="red">DESL</button>
            <button class="green">LIGA</button>
          </div>
          <div class="row math">
            <button class="blue arithmetic">+</button>
            <button class="blue arithmetic">-</button>
            <button class="blue arithmetic">X</button>
            <button class="blue arithmetic">÷</button>
          </div>
        </div>

      </div>

      <div class="row numbers">
        <button class="number-tone-button">
          <div class="row number-button">0</div>
          <div class="row tone-button">PAUSA</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">1</div>
          <div class="row tone-button">DÓ</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">2</div>
          <div class="row tone-button">RÉ</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">3</div>
          <div class="row tone-button">MI</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">4</div>
          <div class="row tone-button">FÁ</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">5</div>
          <div class="row tone-button">SOL</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">6</div>
          <div class="row tone-button">LÁ</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">7</div>
          <div class="row tone-button">SI</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">8</div>
          <div class="row tone-button">DÓ</div>
        </button>
        <button class="number-tone-button">
          <div class="row number-button">9</div>
          <div class="row tone-button">RÉ</div>
        </button>
      </div>

      <div class="row modes">
        <button class="yellow" title="ADIÇÃO">ADIÇÃO</button>
        <button class="yellow" title="SUBTRAÇÃO">SUBTRAÇÃO</button>
        <button class="yellow" title="MULTIPLICAÇÃO">MULTIPLICAÇÃO</button>
        <button class="yellow" title="DIVISÃO">DIVISÃO</button>
        <button class="yellow" title="ARITMÉTICA">ARITMÉTICA</button>
        <button class="yellow" title="OPERAÇÃO">OPERAÇÃO</button>
        <button class="yellow" title="SIGA-ME">SIGA-ME</button>
        <button class="yellow" title="MEMÓRIA DE TONS">MEMÓRIA DE TONS</button>
        <button class="yellow" title="NÚMERO DO MEIO">NÚMERO DO MEIO</button>
        <button class="yellow" title="ADIVINHE O NÚMERO">ADIVINHE O NÚMERO</button>
      </div>

    </div>
  </div>

  <script type="module" src="./scripts/main.js"></script>

</body>

</html>
